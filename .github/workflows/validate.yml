name: Validate

on:
  pull_request:
    branches: [production]
  workflow_dispatch:

# Least-privilege token: checkout needs contents:read; the status steps post
# commit statuses, which need statuses:write.
permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
          fetch-depth: 2

      - name: Get commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate content
        id: validate
        run: |
          npx lens-content-processor@latest . --output validation-result.json || true

          python3 - <<'PY'
          import json, os

          try:
              data = json.load(open("validation-result.json"))
          except Exception as e:
              print(f"::error::Could not read validation output: {e}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("real_count=1\nwip_count=0\n")
              raise SystemExit(0)

          issues = data.get("errors", [])
          errors = [e for e in issues if e.get("severity") == "error"]
          warnings = [e for e in issues if e.get("severity") == "warning"]

          def is_wip(path):
              """A file is work-in-progress if its frontmatter carries the tag."""
              try:
                  text = open(path, encoding="utf-8", errors="replace").read()
              except OSError:
                  return False
              fm = text.split("---", 2)[1] if text.startswith("---") and text.count("---") >= 2 else text
              return "work-in-progress" in fm

          real, wip = [], []
          for e in errors:
              (wip if is_wip(e.get("file", "")) else real).append(e)

          def annotate(level, e):
              loc = f"file={e.get('file')},line={e.get('line') or 1}"
              print(f"::{level} {loc}::{e.get('message')}")

          for e in real:
              annotate("error", e)
          for e in wip:
              annotate("warning", e)  # WIP placeholders: visible, non-blocking
          for w in warnings:
              annotate("warning", w)

          summary = (
              f"Validation: {len(real)} non-WIP error(s) (blocking), "
              f"{len(wip)} work-in-progress error(s) (non-blocking), "
              f"{len(warnings)} warning(s)."
          )
          print(summary)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as f:
              f.write("### Content validation\n\n" + summary + "\n")
              if real:
                  f.write("\n**Blocking (non-WIP) errors:**\n")
                  for e in real:
                      f.write(f"- `{e.get('file')}:{e.get('line') or '?'}` — {e.get('message')}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"real_count={len(real)}\n")
              f.write(f"wip_count={len(wip)}\n")
          PY

      - name: Record validation statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ steps.sha.outputs.sha }}
          REAL="${{ steps.validate.outputs.real_count }}"
          WIP="${{ steps.validate.outputs.wip_count }}"
          REAL="${REAL:-1}"; WIP="${WIP:-0}"

          # validation/content — the promote-ready gate. Mark THIS required in
          # branch protection so real errors block; WIP never affects it.
          [ "$REAL" = "0" ] && CSTATE=success || CSTATE=failure
          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state="$CSTATE" -f context="validation/content" \
            -f description="$REAL non-WIP error(s)" || echo "failed to set validation/content"

          # validation/wip — informational. Leave this NOT required: it shows red
          # when work-in-progress placeholders are incomplete, without blocking.
          [ "$WIP" = "0" ] && WSTATE=success || WSTATE=failure
          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state="$WSTATE" -f context="validation/wip" \
            -f description="$WIP work-in-progress placeholder(s)" || echo "failed to set validation/wip"

      - name: Fail on non-WIP errors
        if: steps.validate.outputs.real_count != '0'
        run: |
          echo "Blocking: ${{ steps.validate.outputs.real_count }} non-WIP validation error(s). See annotations."
          exit 1
