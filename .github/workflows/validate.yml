name: Validate

on:
  pull_request:
    branches: [production]
  workflow_dispatch:

# Least-privilege token: checkout needs contents:read; the "Record validation
# result" step posts a commit status, which needs statuses:write.
permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
          fetch-depth: 2

      - name: Get commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate content
        id: validate
        run: |
          npx lens-content-processor@latest . --output validation-result.json

          # Count only errors (not warnings)
          ERROR_COUNT=$(jq '[.errors[] | select(.severity == "error")] | length' validation-result.json)
          WARNING_COUNT=$(jq '[.errors[] | select(.severity == "warning")] | length' validation-result.json)
          echo "Found $ERROR_COUNT errors and $WARNING_COUNT warnings"

          # Show warnings as annotations (non-blocking)
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo ""
            echo "## Warnings"
            echo ""
            jq -r '.errors[] | select(.severity == "warning") | "::warning file=\(.file),line=\(.line // 1)::\(.message)\(if .suggestion then " (" + .suggestion + ")" else "" end)"' validation-result.json
            echo ""
            jq -r '.errors[] | select(.severity == "warning") | "- **\(.file):\(.line // "?")** - \(.message)"' validation-result.json
          fi

          # Show errors and fail if any
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo ""
            echo "## Validation Errors"
            echo ""
            jq -r '.errors[] | select(.severity == "error") | "::error file=\(.file),line=\(.line // 1)::\(.message)\(if .suggestion then " (" + .suggestion + ")" else "" end)"' validation-result.json
            echo ""
            jq -r '.errors[] | select(.severity == "error") | "- **\(.file):\(.line // "?")** - \(.message)"' validation-result.json
            exit 1
          fi

          echo "✓ All content validated successfully"

      - name: Record validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ steps.sha.outputs.sha }}
          if [ "${{ steps.validate.outcome }}" == "success" ]; then
            STATE="success"
            DESC="Validation passed"
          else
            STATE="failure"
            DESC="Validation failed"
          fi

          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state="$STATE" \
            -f context="validation/content" \
            -f description="$DESC" || echo "Failed to set status"
